:root{--paper:#f7f4ee;--card:rgba(248,245,239,.84);--panel:rgba(241,238,232,.82);--ink:#24324e;--blue:#2050e2;--orange:#ff6b2a;--pink:#e94da1;--purple:#865ef2;--green:#67b75f;--line:#c9bfb1;--hand:'GameHand','DFKai-SB','BiauKai','KaiTi',serif;--resultHand:'Iansui','GameHand','Yusei Magic','DFKai-SB','BiauKai','KaiTi',cursive;--ui:'PingFang TC','Microsoft JhengHei',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);font-family:var(--ui);color:var(--ink)}
body{min-height:100dvh}
.app::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 1px, transparent 1.6px),radial-gradient(circle at 78% 30%, rgba(255,255,255,.35) 0 .8px, transparent 1.5px),radial-gradient(circle at 32% 74%, rgba(0,0,0,.05) 0 .8px, transparent 1.4px),radial-gradient(circle at 64% 82%, rgba(0,0,0,.04) 0 .7px, transparent 1.4px);background-size:36px 36px,42px 42px,48px 48px,54px 54px;mix-blend-mode:multiply;z-index:0}
.app>*{position:relative;z-index:1}
.app{width:min(100vw,430px);min-height:100dvh;margin:0 auto;background:var(--paper);overflow:hidden;position:relative}
.screen{display:none;min-height:100dvh;background:var(--paper);padding-bottom:18px}
.screen.active{display:block}
button{font:inherit}
img{display:block;max-width:100%}

/* 首頁：插圖本身含手繪按鈕，透明熱區只負責點擊 */
.start-wrap{position:relative;width:100%;overflow:hidden;background:var(--paper)}
.start-art{width:100%;height:auto;display:block;object-fit:contain;object-position:center top}
.start-hit{position:absolute;left:18%;right:18%;bottom:4.8%;height:10.2%;border:0;background:transparent;border-radius:999px;cursor:pointer}

/* 關卡 */
.stage-wrap{position:relative;width:100%;overflow:hidden;background:var(--paper)}
.stage-art{width:100%;height:auto;display:block}
.stage-art.landscape{aspect-ratio:auto;object-fit:contain}
.stage-art.portrait{aspect-ratio:auto;object-fit:contain;object-position:center top}
.back-hit{position:absolute;left:0;top:0;width:18%;height:18%;border:0;background:transparent;cursor:pointer}
.choices{display:grid;gap:8px;padding:8px 12px 0}
.choice{display:flex;align-items:center;gap:13px;min-height:64px;padding:0 15px;border:2px solid var(--line);border-radius:21px;background:var(--card);cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.38) inset}
.choice .dot{width:21px;height:21px;border-radius:50%;border:2px solid #d6cec3;background:#fff;flex:0 0 auto}
.choice .letter{flex:1;text-align:center;color:var(--blue);font-family:var(--hand);font-size:40px;font-weight:900;line-height:1}
.choice:active{transform:translateY(1px)}

/* 結果：手機單頁可視、保持與前面頁面相同寬度 */
#result.screen{
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
  padding-bottom:0;
}
.result-wrap{
  height:100%;
  padding:0 10px 8px;
  display:flex;
  flex-direction:column;
}
.result-art-wrap{
  position:relative;
  margin:0 -10px 7px;
  flex:0 0 auto;
}
.result-art{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:auto;
  object-fit:contain;
}
.result-back{position:absolute;left:0;top:0;width:16%;height:16%;border:0;background:transparent;cursor:pointer}
.result-card{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:18px;
  padding:11px 11px 10px;
  font-family:var(--resultHand);
  flex:0 0 auto;
}
.result-text{
  font-family:var(--resultHand) !important;
  font-size:14px;
  line-height:1.48;
  color:var(--ink);
  word-break:break-word;
  letter-spacing:.01em;
  font-weight:400;
}
.result-text strong{
  font-family:var(--resultHand) !important;
  color:var(--blue);
  font-size:21px;
  line-height:1.15;
  letter-spacing:.01em;
  font-weight:400;
}
.score-box{
  margin-top:8px;
  background:var(--panel);
  border-radius:17px;
  padding:9px 10px 8px;
}
.score-title{
  margin:0 0 7px;
  color:var(--blue);
  font-family:var(--resultHand) !important;
  font-size:24px;
  font-weight:400;
  line-height:1.05;
  letter-spacing:.01em;
}
.score-list{display:grid;gap:5px}
.score-row{
  display:grid;
  grid-template-columns:96px 1fr 30px;
  gap:7px;
  align-items:center;
  min-height:25px;
}
.label{
  font-family:var(--resultHand) !important;
  font-size:13px;
  font-weight:400;
  line-height:1.08;
}
.meter{height:8px;border-radius:999px;background:#d2d2d2;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px}
.num{
  font-family:var(--resultHand) !important;
  text-align:right;
  font-size:17px;
  font-weight:400;
  color:var(--ink);
}
.score-row.japan .label{color:#2457db} .score-row.japan .meter i{background:#4b77ff}
.score-row.chinese .label{color:#f16d24} .score-row.chinese .meter i{background:#ff7b36}
.score-row.boundary .label{color:#875af0} .score-row.boundary .meter i{background:#9366ff}
.score-row.instrumental .label{color:#e148ab} .score-row.instrumental .meter i{background:#ea56b7}
.score-row.senior .label{color:#44a247} .score-row.senior .meter i{background:#71bb5f}
.result-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:7px;
  flex:0 0 auto;
}
.action-btn{border:0;background:transparent;padding:0;cursor:pointer;overflow:visible;min-width:0}
.action-btn.image-btn img{
  display:block;
  width:100%;
  height:52px;
  object-fit:contain;
}
.action-btn.image-btn:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid rgba(32,80,226,.28);outline-offset:2px}

/* 較矮的手機：再壓縮垂直空間，避免結果頁需要捲動 */
@media(max-height:760px){
  .result-wrap{padding:0 8px 6px}
  .result-art-wrap{margin:0 -8px 5px}
  .result-card{padding:8px 9px 8px;border-radius:16px}
  .result-text{font-size:12.5px;line-height:1.4}
  .result-text strong{font-size:18px}
  .score-box{margin-top:6px;padding:7px 8px 6px}
  .score-title{font-size:20px;margin-bottom:5px}
  .score-list{gap:3px}
  .score-row{grid-template-columns:84px 1fr 26px;gap:5px;min-height:22px}
  .label{font-size:11px}
  .num{font-size:15px}
  .meter{height:7px}
  .result-actions{margin-top:5px;gap:8px}
  .action-btn.image-btn img{height:43px}
}
@media(max-width:380px){
  .choice{min-height:60px}
  .choice .letter{font-size:38px}
  .result-text{font-size:13px}
  .score-row{grid-template-columns:86px 1fr 27px;gap:5px}
  .label{font-size:11.5px}
  .score-title{font-size:21px}
  .action-btn.image-btn img{height:46px}
}
@media(max-width:380px) and (max-height:700px){
  .result-text{font-size:11.5px;line-height:1.35}
  .result-text strong{font-size:17px}
  .score-title{font-size:18px}
  .score-row{grid-template-columns:78px 1fr 24px;min-height:20px}
  .label{font-size:10px}
  .num{font-size:13px}
  .action-btn.image-btn img{height:39px}
}

/* === final mobile full-screen layout + result styling === */
:root{--resultHand:'Iansui','GameHand','Yusei Magic','DFKai-SB','BiauKai','KaiTi',cursive}
#start.screen,#game.screen,#result.screen{height:100dvh;min-height:100dvh;overflow:hidden;padding-bottom:0}
#start.active,#game.active,#result.active{display:flex;flex-direction:column}
#start .start-wrap{flex:1;min-height:0;height:100%}
#start .start-art{width:100%;height:100%;object-fit:contain;object-position:center top}
#game .stage-wrap{flex:1;min-height:0;height:auto;display:flex;align-items:stretch}
#game .stage-art{width:100%;height:100%;object-fit:contain;object-position:center top}
#game .choices{flex:0 0 auto;padding:6px 10px 8px;gap:6px}
#game .choice{min-height:54px;padding:0 12px;border-radius:18px;gap:11px}
#game .choice .dot{width:18px;height:18px}
#game .choice .letter{font-size:34px}
#result .result-wrap{height:100%;padding:0 10px 8px;display:flex;flex-direction:column;gap:8px}
#result .result-art-wrap{position:relative;flex:0 0 auto;margin:0 -10px 0}
#result .result-art{display:block;width:100%;height:auto;max-height:22vh;object-fit:contain;object-position:center top}
#result .result-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0;background:transparent;border:0;border-radius:0;font-family:var(--resultHand)}
#result .result-text{position:relative;flex:0 0 auto;padding:14px 16px 12px;border:2px solid var(--line);border-radius:24px;background:rgba(255,252,247,.78);font-family:var(--resultHand)!important;font-size:13px;line-height:1.42;color:var(--ink);word-break:break-word;letter-spacing:.01em;font-weight:700}
#result .analysis-head{margin:0 94px 8px 0;color:var(--blue);font-family:var(--resultHand)!important;font-size:20px;line-height:1.05;font-weight:700}
#result .analysis-head span{position:relative;display:inline-block;z-index:0}
#result .analysis-head span::after{content:'';position:absolute;left:-9px;right:-9px;bottom:4px;height:15px;background:rgba(157,204,255,.72);border-radius:999px;z-index:-1;transform:rotate(-2deg)}

<body>
<main class="app">
  <section id="start" class="screen active" aria-label="首頁">
    <div class="start-wrap">
      <img class="start-art" src="assets/start.png" alt="在日華人社交生存戰首頁插圖">
      <button id="startBtn" class="start-hit" type="button" aria-label="開始挑戰"></button>
    </div>
  </section>

  <section id="game" class="screen" aria-label="遊戲關卡">
    <div class="stage-wrap">
      <img id="stageArt" class="stage-art landscape" alt="關卡手繪插圖">
      <button id="backBtn" class="back-hit" type="button" aria-label="返回首頁"></button>
    </div>
    <div class="choices">
      <button class="choice" data-choice="0" type="button" aria-label="選擇 A"><span class="dot" aria-hidden="true"></span><span class="letter">A</span></button>
      <button class="choice" data-choice="1" type="button" aria-label="選擇 B"><span class="dot" aria-hidden="true"></span><span class="letter">B</span></button>
      <button class="choice" data-choice="2" type="button" aria-label="選擇 C"><span class="dot" aria-hidden="true"></span><span class="letter">C</span></button>
    </div>
  </section>

  <section id="result" class="screen" aria-label="結果頁">
    <div class="result-wrap">
      <div class="result-art-wrap">
        <img id="resultArt" class="result-art" alt="遊戲結果手繪插圖">
        <button id="resultBackBtn" class="result-back" type="button" aria-label="返回首頁"></button>
      </div>
      <div class="result-card">
        <div class="score-box">
          <div class="score-title">各項指標分數</div>
          <div id="scoreList" class="score-list"></div>
        </div>
      </div>
      <div class="result-actions">
        <button id="restartBtn" class="action-btn image-btn" type="button" aria-label="再玩一次"><img src="assets/restart.png" alt="再玩一次"></button>
        <button id="shareBtn" class="action-btn image-btn" type="button" aria-label="分享結果"><img src="assets/share.png" alt="分享結果"></button>
      </div>
    </div>
  </section>
</main>
<script>
const stageImages = [
  'assets/stage1.png',
  'assets/stage2.png',
  'assets/stage3.png',
  'assets/stage4.png',
  'assets/stage5.png',
  'assets/stage6.png'
];
const stagePortrait = [false,false,false,false,false,false];
const resultImages = { fit:'assets/result_fit.png', assimilate:'assets/result_assimilate.png', enclave:'assets/result_enclave.png' };
const stages = [
  {choices:[{score:{japan:2,chinese:-1,senior:-1}},{score:{senior:2,chinese:1,instrumental:1}},{score:{boundary:1,instrumental:-2,senior:-1}}]},
  {choices:[{score:{japan:2,chinese:-2}},{score:{chinese:2,japan:-1}},{score:{chinese:2,senior:1,instrumental:1}}]},
  {choices:[{score:{boundary:-3,japan:1}},{score:{boundary:2,chinese:2,instrumental:1}},{score:{japan:2,boundary:-2}}]},
  {choices:[{score:{senior:2,instrumental:2,chinese:1}},{score:{japan:2,instrumental:-2,senior:-1}},{score:{boundary:1,instrumental:1}}]},
  {choices:[{score:{japan:2,boundary:-1}},{score:{chinese:2,japan:-2,senior:1}},{score:{boundary:2,chinese:1}}]},
  {choices:[{score:{japan:2,chinese:-2}},{score:{boundary:2,chinese:1,instrumental:1}},{score:{chinese:2,instrumental:1}}]}
];
const dims = {japan:'日本社會融入度',chinese:'華人網絡依賴度',boundary:'文化邊界維持',instrumental:'工具性互助感知',senior:'前輩資源連結'};
const endings = {
  fit:{title:'游刃有餘的「跨文化配得」大師',text:'你採用了這篇論文指出的主流模式——「跨文化配得」！你深諳「社交雙軌制」，對外能以「禮」融入日本社會、保持陌生人式的安全距離以避免衝突。對內，你又能透過微信、小紅書與前輩建立基於「應有之情」的互助網絡來獲取資源，完美達成了跨文化平衡與權力協商。'},
  assimilate:{title:'破釜沉舟的「過度同化者」',text:'你試圖打破外國人的邊界，採用單一的東道國邏輯在日本生存。但文獻提醒，由於日本社會具有團體主義與排外特徵，外來族群往往被排除在外。完全放棄華人互助網絡可能會讓你遭遇較大的挫折感、權力失衡，並失去東道國與母國的雙重社會資源。'},
  enclave:{title:'封閉的「數字飛地」居民',text:'你過度依賴母國的社交媒體，在線上建構了一個「沒有陌生人的小圈子」（新型熟人社會）。雖然透過同胞的資源共享讓你生活無虞，但這導致你與真實的日本社會產生資訊斷裂，文化學習與實際行為脫節，難以真正理解當地制度與文化。'}
};
let scores={japan:0,chinese:0,senior:0,boundary:0,instrumental:0};
let stageIndex=0;
let resultKey='fit';
const screens={start:document.getElementById('start'),game:document.getElementById('game'),result:document.getElementById('result')};
const stageArt=document.getElementById('stageArt');
const resultArt=document.getElementById('resultArt');
const scoreList=document.getElementById('scoreList');
function showScreen(name){Object.values(screens).forEach(el=>el.classList.remove('active'));screens[name].classList.add('active');window.scrollTo(0,0)}
function resetGame(){scores={japan:0,chinese:0,senior:0,boundary:0,instrumental:0};stageIndex=0;resultKey='fit'}
function renderStage(){stageArt.src=stageImages[stageIndex];stageArt.className='stage-art landscape'}
function choose(idx){const delta=stages[stageIndex].choices[idx].score;Object.entries(delta).forEach(([k,v])=>scores[k]+=v);stageIndex+=1;if(stageIndex<6)renderStage();else{renderResult();showScreen('result')}}
const ENCLAVE_CHINESE_HIGH=7; // 華人網絡依賴度「極高」：可達最高 10 分，7 分以上視為極高
const ENCLAVE_LOW=0;          // 文化邊界維持／日本社會融入度「極低」：0 分以下
function decideEnding(){
  const max=Math.max(...Object.values(scores));
  const highest=Object.keys(scores).filter(k=>scores[k]===max);
  // 結局三優先：華人網絡依賴度極高，且文化邊界維持或日本社會融入度極低。
  if(scores.chinese>=ENCLAVE_CHINESE_HIGH&&(scores.boundary<=ENCLAVE_LOW||scores.japan<=ENCLAVE_LOW))return'enclave';
  // 結局二：日本社會融入度為單獨最高分。
  if(highest.length===1&&highest[0]==='japan')return'assimilate';
  // 結局一：文化邊界維持、工具性互助感知或前輩資源連結最高（含並列最高）。
  if(highest.some(k=>['boundary','instrumental','senior'].includes(k)))return'fit';
  // 華人網絡依賴度雖最高但未達「數字飛地」門檻時，三結局架構中回到跨文化配得。
  return'fit';
}
function signed(n){return n>0?`+${n}`:`${n}`}
function meterWidth(v,d){const r={japan:[-3,12],chinese:[-5,10],boundary:[-4,8],instrumental:[-4,6],senior:[-2,6]}[d];return Math.max(4,Math.min(100,((v-r[0])/(r[1]-r[0]))*100))}
function renderResult(){
  resultKey=decideEnding();
  resultArt.src=resultImages[resultKey];
  const e=endings[resultKey];
  scoreList.innerHTML='';
  ['japan','chinese','boundary','instrumental','senior'].forEach(dim=>{
    const row=document.createElement('div');
    row.className=`score-row ${dim}`;
    row.innerHTML=`<div class="label"><span class="label-text">${dims[dim]}</span></div><div class="meter"><i style="width:${meterWidth(scores[dim],dim)}%"></i></div><div class="num">${signed(scores[dim])}</div>`;
    scoreList.appendChild(row)
  })
}
async function shareResult(){const text=`我的「在日華人社交生存戰」結果是：${endings[resultKey].title}`;if(navigator.share){try{await navigator.share({title:'在日華人社交生存戰',text})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(text);const b=document.getElementById('shareBtn');const old=b.textContent;b.textContent='已複製';setTimeout(()=>b.textContent=old,1200)}}
document.getElementById('startBtn').addEventListener('click',()=>{resetGame();renderStage();showScreen('game')});
document.getElementById('backBtn').addEventListener('click',()=>showScreen('start'));
document.getElementById('resultBackBtn').addEventListener('click',()=>showScreen('start'));
document.querySelectorAll('.choice').forEach((b,i)=>b.addEventListener('click',()=>choose(i)));
document.getElementById('restartBtn').addEventListener('click',()=>{resetGame();renderStage();showScreen('game')});
document.getElementById('shareBtn').addEventListener('click',shareResult);
</script>
</body>
