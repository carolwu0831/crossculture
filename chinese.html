<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>在日華人社交生存戰</title>

<style>

/* =========================================================
   手寫字體
   1. 優先使用繁中網路手寫字
   2. 接原本 gamehand2.woff2
   3. 再接 Mac / Windows 楷體
========================================================= */

@import url(
  'https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;500;700&display=swap'
);

@font-face{
  font-family:"GameHandLocal";
  src:url("./gamehand2.woff2") format("woff2");
  font-display:swap;
}


/* =========================================================
   全域設定
========================================================= */

:root{

  --paper:#f7f1e6;
  --paper-light:#fffdf8;

  --ink:#173a79;

  --blue:#1853df;
  --orange:#ff6727;
  --purple:#7548eb;
  --pink:#e73e9d;
  --green:#269756;

  --grey:#c9c8c5;
  --line:#aaa69d;

  --hand:
    "LXGW WenKai TC",
    "GameHandLocal",
    "Hannotate TC",
    "HanziPen TC",
    "Kaiti TC",
    "STKaiti",
    "KaiTi",
    "DFKai-SB",
    "BiauKai",
    cursive;

  --ui:
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}


*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body{

  margin:0;

  min-height:100%;

  background:#e9e2d7;

  color:var(--ink);

  font-family:var(--ui);

}


body{
  min-height:100dvh;
}


button{
  font:inherit;
}


/* =========================================================
   手機遊戲外框
========================================================= */

.app{

  width:min(100vw,430px);

  min-height:100dvh;

  margin:0 auto;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(255,255,255,.5),
      transparent 28%
    ),
    var(--paper);

}


/* =========================================================
   畫面控制
========================================================= */

.screen{

  display:none;

  min-height:100dvh;

  background:var(--paper);

}


.screen.active{
  display:block;
}


/* =========================================================
   首頁
========================================================= */

.start-wrap{

  position:relative;

  width:100%;

  height:100dvh;

  overflow:hidden;

  background:var(--paper);

}


.start-art{

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

  object-position:center top;

}


/*
  首頁開始按鈕已畫在圖片裡
  因此 HTML 只保留透明點擊區
*/

.start-hit{

  position:absolute;

  left:17%;
  right:17%;

  bottom:4%;

  height:12%;

  border:0;

  border-radius:999px;

  background:transparent;

  cursor:pointer;

}


/* =========================================================
   關卡頁
========================================================= */

.stage-wrap{

  position:relative;

  width:100%;

  overflow:hidden;

  background:var(--paper);

}


.stage-art{

  display:block;

  width:100%;

  height:auto;

  object-fit:contain;

  object-position:center top;

}


/*
  圖中的返回箭頭透明點擊區
*/

.back-hit{

  position:absolute;

  left:0;

  top:0;

  width:18%;

  height:18%;

  border:0;

  background:transparent;

  cursor:pointer;

}


/* =========================================================
   A / B / C
========================================================= */

.choices{

  display:grid;

  gap:9px;

  padding:
    8px
    12px
    calc(18px + env(safe-area-inset-bottom));

}


.choice{

  display:flex;

  align-items:center;

  width:100%;

  min-height:68px;

  padding:0 18px;

  border:2px solid #c3bbaf;

  border-radius:22px;

  background:#fffdf9;

  box-shadow:
    0 3px 0
    rgba(70,60,50,.06);

  cursor:pointer;

}


.choice:active{

  transform:translateY(2px);

}


.choice-dot{

  width:23px;

  height:23px;

  flex:0 0 auto;

  border:2px solid #ccc4b9;

  border-radius:50%;

  background:#fff;

}


.choice-letter{

  flex:1;

  padding-right:23px;

  text-align:center;

  color:var(--blue);

  font-family:var(--hand);

  font-size:42px;

  font-weight:700;

  line-height:1;

}


/* =========================================================
   結果頁
========================================================= */

.result-wrap{

  padding:
    0
    14px
    calc(22px + env(safe-area-inset-bottom));

}


/* =========================================================
   結果上方插圖
========================================================= */

.result-top{

  position:relative;

}


.result-art{

  display:block;

  width:100%;

  height:auto;

}


/*
  結果圖片左上角返回按鈕
*/

.result-back{

  position:absolute;

  top:0;

  left:0;

  width:54px;

  height:54px;

  border:0;

  background:transparent;

  cursor:pointer;

}


/* =========================================================
   重要：
   結果頁「所有文字」強制手寫
========================================================= */

#result,
#result *{

  font-family:var(--hand) !important;

}


/* =========================================================
   結果解析卡
========================================================= */

.result-card{

  position:relative;

  margin-top:12px;

  padding:
    26px
    20px
    21px;

  overflow:hidden;

  border:3px solid #ada79c;

  border-radius:25px;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(255,255,255,.75),
      transparent 25%
    ),
    radial-gradient(
      circle at 90% 70%,
      rgba(231,222,206,.32),
      transparent 28%
    ),
    #fffdf7;

}


/* =========================================================
   文獻解析標題
========================================================= */

.analysis-title{

  position:relative;

  z-index:2;

  display:inline-block;

  margin:
    0
    0
    18px;

  color:var(--blue);

  font-family:var(--hand) !important;

  font-size:34px;

  font-weight:700;

  line-height:1;

  letter-spacing:.04em;

  transform:rotate(-1deg);

}


/* 蠟筆底線 */

.analysis-title::after{

  content:"";

  position:absolute;

  z-index:-1;

  left:-7px;

  right:-9px;

  bottom:-7px;

  height:13px;

  border-radius:50%;

  background:#add8ff;

  opacity:.72;

  transform:rotate(-2deg);

}


/* =========================================================
   文獻解析內文
   這是之前一直掉回黑體的地方
========================================================= */

.analysis-text{

  position:relative;

  z-index:2;

  margin:0;

  padding-right:2px;

  color:#17366c;

  font-family:var(--hand) !important;

  font-size:21px;

  font-weight:500;

  line-height:1.85;

  letter-spacing:.025em;

  word-break:break-word;

  text-align:left;

}


/* =========================================================
   富士山小圖示
   純 CSS，不使用額外圖片
========================================================= */

.analysis-icon{

  position:absolute;

  top:20px;

  right:20px;

  width:74px;

  height:62px;

  opacity:.96;

  pointer-events:none;

}


.analysis-icon .sun{

  position:absolute;

  top:0;

  right:4px;

  width:27px;

  height:27px;

  border-radius:50%;

  background:var(--orange);

}


.analysis-icon .mountain{

  position:absolute;

  left:0;

  right:0;

  bottom:0;

  height:42px;

  background:var(--blue);

  clip-path:polygon(
    0 100%,
    37% 25%,
    48% 47%,
    59% 36%,
    100% 100%
  );

}


/* =========================================================
   分數區
========================================================= */

.score-box{

  position:relative;

  z-index:1;

  margin-top:23px;

  padding:
    22px
    15px
    18px;

  border-radius:23px;

  background:
    rgba(235,235,230,.88);

}


/* =========================================================
   各項指標分數
========================================================= */

.score-title{

  position:relative;

  z-index:2;

  display:inline-block;

  margin:
    0
    0
    25px
    7px;

  color:var(--blue);

  font-family:var(--hand) !important;

  font-size:35px;

  font-weight:700;

  line-height:1;

  letter-spacing:.04em;

  transform:rotate(-1deg);

}


.score-title::after{

  content:"";

  position:absolute;

  z-index:-1;

  left:-8px;

  right:-12px;

  bottom:-8px;

  height:14px;

  border-radius:50%;

  background:#b2dbff;

  opacity:.75;

}


/* =========================================================
   五個指標
========================================================= */

.score-list{

  display:grid;

  gap:17px;

}


.score-row{

  display:grid;

  grid-template-columns:
    125px
    1fr
    45px;

  gap:11px;

  align-items:center;

}


/* =========================================================
   指標名稱
========================================================= */

.score-label{

  font-family:var(--hand) !important;

  font-size:18px;

  font-weight:700;

  line-height:1.2;

  letter-spacing:.015em;

  white-space:nowrap;

}


/* =========================================================
   分數數字
========================================================= */

.score-number{

  font-family:var(--hand) !important;

  color:#17366c;

  font-size:25px;

  font-weight:700;

  line-height:1;

  text-align:right;

}


/* =========================================================
   指標長條
========================================================= */

.meter{

  position:relative;

  height:13px;

  overflow:hidden;

  border-radius:999px;

  background:#c9c9c9;

}


.meter-fill{

  display:block;

  height:100%;

  border-radius:999px;

}


/* =========================================================
   五項顏色
========================================================= */

.score-row.japan
.score-label{

  color:#1859e6;

}


.score-row.japan
.meter-fill{

  background:#3272f6;

}


.score-row.chinese
.score-label{

  color:#f05c1d;

}


.score-row.chinese
.meter-fill{

  background:#ff6e2d;

}


.score-row.boundary
.score-label{

  color:#713be4;

}


.score-row.boundary
.meter-fill{

  background:#8351f1;

}


.score-row.instrumental
.score-label{

  color:#df268d;

}


.score-row.instrumental
.meter-fill{

  background:#eb47a2;

}


.score-row.senior
.score-label{

  color:#168c52;

}


.score-row.senior
.meter-fill{

  background:#46b568;

}


/* =========================================================
   底部按鈕
========================================================= */

.result-actions{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:14px;

  margin-top:19px;

}


.result-btn{

  position:relative;

  height:71px;

  border-radius:999px;

  cursor:pointer;

  font-family:var(--hand) !important;

  font-size:29px;

  font-weight:700;

  letter-spacing:.06em;

}


/* 再玩一次 */

.result-btn.restart{

  color:var(--blue);

  border:4px solid var(--blue);

  background:#fffdf8;

  box-shadow:
    0
    3px
    0
    rgba(28,80,220,.1);

  transform:rotate(-.7deg);

}


/* 分享結果 */

.result-btn.share{

  color:#fff;

  border:4px solid var(--orange);

  background:var(--orange);

  box-shadow:
    0
    3px
    0
    rgba(255,105,38,.18);

  transform:rotate(.6deg);

}


/* =========================================================
   小螢幕
========================================================= */

@media(max-width:380px){

  .choice{
    min-height:63px;
  }


  .choice-letter{
    font-size:38px;
  }


  .result-card{

    padding:
      23px
      16px
      18px;

  }


  .analysis-title{

    font-size:29px;

  }


  .analysis-text{

    font-size:18px;

    line-height:1.8;

  }


  .analysis-icon{

    width:63px;

    height:54px;

  }


  .score-title{

    font-size:30px;

  }


  .score-row{

    grid-template-columns:
      108px
      1fr
      38px;

    gap:8px;

  }


  .score-label{

    font-size:15px;

  }


  .score-number{

    font-size:21px;

  }


  .result-btn{

    height:64px;

    font-size:25px;

  }

}

</style>
</head>


<body>


<main class="app">


<!-- =====================================================
     首頁
===================================================== -->

<section
  id="start"
  class="screen active"
>

  <div class="start-wrap">


    <img
      class="start-art"
      src="./art_start.png"
      alt="在日華人社交生存戰"
    >


    <button
      id="startBtn"
      class="start-hit"
      type="button"
      aria-label="開始挑戰"
    ></button>


  </div>

</section>



<!-- =====================================================
     關卡
===================================================== -->

<section
  id="game"
  class="screen"
>

  <div class="stage-wrap">


    <img
      id="stageArt"
      class="stage-art"
      src=""
      alt="遊戲關卡"
    >


    <button
      id="backBtn"
      class="back-hit"
      type="button"
      aria-label="返回首頁"
    ></button>


  </div>


  <div class="choices">


    <button
      class="choice"
      data-choice="0"
      type="button"
      aria-label="選擇 A"
    >

      <span class="choice-dot"></span>

      <span class="choice-letter">
        A
      </span>

    </button>


    <button
      class="choice"
      data-choice="1"
      type="button"
      aria-label="選擇 B"
    >

      <span class="choice-dot"></span>

      <span class="choice-letter">
        B
      </span>

    </button>


    <button
      class="choice"
      data-choice="2"
      type="button"
      aria-label="選擇 C"
    >

      <span class="choice-dot"></span>

      <span class="choice-letter">
        C
      </span>

    </button>


  </div>

</section>



<!-- =====================================================
     結果頁
===================================================== -->

<section
  id="result"
  class="screen"
>

  <div class="result-wrap">


    <!-- 結果主插圖 -->

    <div class="result-top">


      <img
        id="resultArt"
        class="result-art"
        src=""
        alt="遊戲結果"
      >


      <button
        id="resultBackBtn"
        class="result-back"
        type="button"
        aria-label="返回首頁"
      ></button>


    </div>



    <!-- =================================================
         全手寫結果解析
    ================================================= -->

    <div class="result-card">


      <div
        class="analysis-icon"
        aria-hidden="true"
      >

        <span class="sun"></span>

        <span class="mountain"></span>

      </div>



      <div class="analysis-title">

        文獻解析：

      </div>



      <p
        id="endingText"
        class="analysis-text"
      ></p>



      <!-- ===============================================
           全手寫動態分數
      ================================================ -->

      <div class="score-box">


        <div class="score-title">

          各項指標分數

        </div>


        <div
          id="scoreList"
          class="score-list"
        ></div>


      </div>


    </div>



    <!-- =================================================
         手寫按鈕
    ================================================= -->

    <div class="result-actions">


      <button
        id="restartBtn"
        class="result-btn restart"
        type="button"
      >

        再玩一次

      </button>


      <button
        id="shareBtn"
        class="result-btn share"
        type="button"
      >

        分享結果

      </button>


    </div>


  </div>

</section>


</main>

/* =========================================================
   六張關卡圖片
========================================================= */

const stageImages = [

};



/* =========================================================

const stages = [

/* =========================================================

const dims = {

/* =========================================================

const endings = {

/* =========================================================

let stageIndex = 0;

  "fit";

};



/* =========================================================

========================================================= */

const screens = {

  start:
    document.getElementById(
      "start"
    ),

  game:

      "game"
    ),

  result:

    )

};



const stageArt =

  );


const resultArt =
  document.getElementById(

const endingText =
  document.getElementById(

const scoreList =

  );



/* =========================================================
   畫面切換
========================================================= */

function showScreen(name){


  Object
    .values(screens)
    .forEach(

      screen => {

        screen
          .classList
          .remove(
            "active"
          );

      }

    );


  screens[name]
    .classList
    .add(
      "active"
    );


  window.scrollTo({

    top:0,

    left:0,

    behavior:"instant"

  });


}



/* =========================================================
   重置遊戲
========================================================= */

function resetGame(){


  stageIndex = 0;


  resultKey =
    "fit";


  scores = {

    japan:0,

    chinese:0,

    senior:0,

    boundary:0,

    instrumental:0

  };


}



/* =========================================================
   顯示關卡
========================================================= */

function renderStage(){


  stageArt.src =
    stageImages[
      stageIndex
    ];


}



/* =========================================================
   選擇答案
========================================================= */

function choose(index){


  const delta =

    stages[
      stageIndex
    ]

    .choices[
      index
    ]

    .score;



  Object
    .entries(
      delta
    )
    .forEach(

      ([dimension,value]) => {


        scores[
          dimension
        ] += value;


      }

    );



  stageIndex += 1;



  if(
    stageIndex <
    stages.length
  ){


    renderStage();


  }


  else{


    renderResult();


    showScreen(
      "result"
    );


  }


}



/* =========================================================
   判斷結局
========================================================= */

function decideEnding(){


  /*
    封閉的數字飛地居民
  */

  if(

    scores.chinese >= 7

    &&

    (

      scores.boundary <= 0

      ||

      scores.japan <= 0

    )

  ){


    return "enclave";


  }



  const maxScore =

    Math.max(

      ...Object.values(
        scores
      )

    );



  const highest =

    Object
      .keys(
        scores
      )
      .filter(

        dimension =>

          scores[
            dimension
          ] === maxScore

      );



  /*
    日本社會融入度
    為唯一最高
  */

  if(

    highest.length === 1

    &&

    highest[0] ===
    "japan"

  ){


    return "assimilate";


  }



  /*
    文化邊界維持
    工具性互助感知
    前輩資源連結
    其中一項最高
  */

  if(

    highest.some(

      dimension =>

        [

          "boundary",

          "instrumental",

          "senior"

        ].includes(
          dimension
        )

    )

  ){


    return "fit";


  }



  return "fit";


}



/* =========================================================
   正負號
========================================================= */

function signed(value){


  if(
    value > 0
  ){


    return `+${value}`;


  }


  return `${value}`;


}



/* =========================================================
   長條圖比例
========================================================= */

function meterWidth(
  value,
  dimension
){


  /*
    六個關卡的理論範圍
  */

  const ranges = {


    japan:[
      -3,
      12
    ],


    chinese:[
      -5,
      10
    ],


    boundary:[
      -4,
      8
    ],


    instrumental:[
      -4,
      6
    ],


    senior:[
      -2,
      6
    ]


  };



  const [
    min,
    max
  ] =
    ranges[
      dimension
    ];



  const percentage =

    (

      (
        value -
        min
      )

      /

      (
        max -
        min
      )

    )

    * 100;



  return Math.max(

    4,

    Math.min(

      100,

      percentage

    )

  );


}



/* =========================================================
   結果頁
========================================================= */

function renderResult(){


  /*
    判斷結局
  */

  resultKey =
    decideEnding();



  /*
    顯示對應結果插圖
  */

  resultArt.src =
    resultImages[
      resultKey
    ];



  /*
    顯示解析
  */

  endingText.textContent =

    endings[
      resultKey
    ].text;



  /*
    清空舊分數
  */

  scoreList.innerHTML =
    "";



  /*
    固定顯示順序
  */

  const order = [

    "japan",

    "chinese",

    "boundary",

    "instrumental",

    "senior"

  ];



  order.forEach(

    dimension => {


      const row =

        document
          .createElement(
            "div"
          );



      row.className =

        `score-row ${dimension}`;



      row.innerHTML = `

        <div
          class="score-label"
        >

          ${dims[dimension]}

        </div>


        <div
          class="meter"
        >

          <span
            class="meter-fill"
            style="
              width:
              ${meterWidth(
                scores[
                  dimension
                ],
                dimension
              )}%;
            "
          ></span>

        </div>


        <div
          class="score-number"
        >

          ${signed(
            scores[
              dimension
            ]
          )}

        </div>

      `;



      scoreList
        .appendChild(
          row
        );


    }

  );


}



/* =========================================================
   分享結果
========================================================= */

async function shareResult(){


  const text =

    `我的「在日華人社交生存戰」結果是：${

      endings[
        resultKey
      ].title

    }`;



  if(
    navigator.share
  ){


    try{


      await navigator.share({


        title:
          "在日華人社交生存戰",


        text:
          text


      });


    }


    catch(error){


      /*
        使用者取消分享時
        不做任何處理
      */


    }


  }


  else if(
    navigator.clipboard
  ){


    await navigator
      .clipboard
      .writeText(
        text
      );



    const shareButton =

      document
        .getElementById(
          "shareBtn"
        );



    const originalText =

      shareButton
        .textContent;



    shareButton
      .textContent =
      "已複製";



    setTimeout(

      () => {


        shareButton
          .textContent =
          originalText;


      },

      1200

    );


  }


}



/* =========================================================
   開始
========================================================= */

document
  .getElementById(
    "startBtn"
  )
  .addEventListener(

    "click",

    () => {


      resetGame();


      renderStage();


      showScreen(
        "game"
      );


    }

  );



/* =========================================================
   關卡返回首頁
========================================================= */

document
  .getElementById(
    "backBtn"
  )
  .addEventListener(

    "click",

    () => {


      showScreen(
        "start"
      );


    }

  );



/* =========================================================
   A / B / C
========================================================= */

document
  .querySelectorAll(
    ".choice"
  )
  .forEach(

    (
      button,
      index
    ) => {


      button
        .addEventListener(

          "click",

          () => {


            choose(
              index
            );


          }

        );


    }

  );



/* =========================================================
   結果返回首頁
========================================================= */

document
  .getElementById(

  )
  .addEventListener(

    () => {


      showScreen(
        "start"
      );


    }

  );



/* =========================================================
   再玩一次
========================================================= */

document
  .getElementById(
    "restartBtn"
  )
  .addEventListener(

  );



/* =========================================================
   分享
========================================================= */

document
  .getElementById(
    "shareBtn"
  )
  .addEventListener(

    "click",

    shareResult

  );


</script>
